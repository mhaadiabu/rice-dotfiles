# Hyprlock configuration - Rice Theme
# Minimal macOS / modern design

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgba(16, 20, 24, 1.0)

    # Clean blur
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    color = rgba(245, 245, 247, 1.0)
    font_size = 64
    font_family = Aptos Narrow
    position = 0, 190
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(212, 212, 216, 0.75)
    font_size = 17
    font_family = Aptos Narrow
    position = 0, 130
    halign = center
    valign = center
}

# USER AVATAR
image {
    monitor =
    size = 90
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.15)
    position = 0, 25
    halign = center
    valign = center
}

# USER NAME
label {
    monitor =
    text = Haadi
    color = rgba(245, 245, 247, 0.9)
    font_size = 16
    font_family = Aptos Narrow
    position = 0, -35
    halign = center
    valign = center
}

# REAL PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(20, 20, 24, 0.65)
    font_color = rgb(245, 245, 247)
    font_family = Aptos Narrow
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8a8e">Enter Password</span>
    hide_input = false
    check_color = rgb(110, 168, 254)
    fail_color = rgb(255, 105, 105)
    fail_text = <i>Incorrect password</i>
    capslock_color = rgb(255, 180, 50)
    position = 0, -95
    halign = center
    valign = center
    rounding = 13
}
